name: Terraform AWS Infrastructure

# Any push to main runs the full pipeline.
# Pull requests stop after the plan, so changes can be reviewed safely.

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

# Only one deployment for the same branch at a time.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_VERSION: "latest"
  PLAN_ARTIFACT: terraform-plan

jobs:

  # --------------------------------------------------------------------------
  # 1. Format, initialise, validate and plan
  # --------------------------------------------------------------------------

  plan:
    name: Format, Validate & Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
      
      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Environment: ${GITHUB_ENVIRONMENT:-none}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Render plan as text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLAN_ARTIFACT }}-${{ github.run_id }}
          path: |
            tfplan
            tfplan.txt
          retention-days: 5
          if-no-files-found: error

      - name: Publish plan summary
        run: |
          {
            echo "## Terraform Plan"
            echo ""
            echo '```'
            head -c 60000 tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # --------------------------------------------------------------------------
  # 2. Human approval gate and apply the reviewed plan
  # --------------------------------------------------------------------------

  apply:
    name: Approve & Apply
    runs-on: ubuntu-latest

    needs: plan

    if: github.event_name != 'pull_request'

    # Configure the "production" Environment in GitHub
    # with required reviewers to create the approval gate.
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-apply-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download the approved plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PLAN_ARTIFACT }}-${{ github.run_id }}

      - name: Terraform Init
        run: terraform init -input=false

      # Apply exactly the plan that was generated and reviewed.
      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan

      - name: Terraform Outputs
        id: outputs
        run: |
          terraform output

          APP_URL=$(terraform output -raw application_url)

          echo "application_url=$APP_URL" >> "$GITHUB_OUTPUT"

          {
            echo "## Deployment Outputs"
            echo ""
            echo "| Output | Value |"
            echo "| --- | --- |"
            echo "| VPC ID | \`$(terraform output -raw vpc_id)\` |"
            echo "| EC2 Instance ID | \`$(terraform output -raw ec2_instance_id)\` |"
            echo "| Elastic IP | \`$(terraform output -raw elastic_ip)\` |"
            echo "| Security Group | \`$(terraform output -raw security_group_id)\` |"
            echo "| IAM Role | \`$(terraform output -raw iam_role_name)\` |"
            echo "| S3 Bucket | \`$(terraform output -raw s3_bucket_name)\` |"
            echo "| Application URL | $APP_URL |"
          } >> "$GITHUB_STEP_SUMMARY"


  # --------------------------------------------------------------------------
  # 3. Validate that the real infrastructure exists and the application works
  # --------------------------------------------------------------------------

  validate-infrastructure:
    name: Infrastructure Validation
    runs-on: ubuntu-latest

    needs: apply

    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-verify-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Read outputs into the environment
        run: |
          {
            echo "VPC_ID=$(terraform output -raw vpc_id)"
            echo "INSTANCE_ID=$(terraform output -raw ec2_instance_id)"
            echo "ELASTIC_IP=$(terraform output -raw elastic_ip)"
            echo "BUCKET=$(terraform output -raw s3_bucket_name)"
            echo "SG_ID=$(terraform output -raw security_group_id)"
            echo "ROLE_NAME=$(terraform output -raw iam_role_name)"
            echo "PROFILE_NAME=$(terraform output -raw iam_instance_profile_name)"
            echo "APP_URL=$(terraform output -raw application_url)"
          } >> "$GITHUB_ENV"

      - name: Verify VPC and networking
        run: |
          aws ec2 describe-vpcs \
            --vpc-ids "$VPC_ID" \
            --query 'Vpcs[0].{State:State,Cidr:CidrBlock}' \
            --output table

          aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'Subnets[].{Subnet:SubnetId,AZ:AvailabilityZone,Cidr:CidrBlock,PublicIP:MapPublicIpOnLaunch}' \
            --output table

          aws ec2 describe-internet-gateways \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query 'InternetGateways[0].InternetGatewayId' \
            --output text

          aws ec2 describe-route-tables \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'RouteTables[].{RT:RouteTableId,Assocs:length(Associations)}' \
            --output table

      - name: Verify EC2 instance and Elastic IP
        run: |
          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].{State:State.Name,Type:InstanceType,AZ:Placement.AvailabilityZone,Profile:IamInstanceProfile.Arn}' \
            --output table

          aws ec2 describe-addresses \
            --public-ips "$ELASTIC_IP" \
            --query 'Addresses[0].{IP:PublicIp,Instance:InstanceId}' \
            --output table

      - name: Verify security group rules
        run: |
          aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=$SG_ID" \
            --query 'SecurityGroupRules[].{Egress:IsEgress,Port:FromPort,Proto:IpProtocol,Cidr:CidrIpv4}' \
            --output table

      - name: Verify S3 bucket is versioned, encrypted and private
        run: |
          aws s3api get-bucket-versioning --bucket "$BUCKET"

          aws s3api get-bucket-encryption --bucket "$BUCKET"

          aws s3api get-public-access-block --bucket "$BUCKET"

      - name: Verify IAM role and instance profile
        run: |
          aws iam get-role \
            --role-name "$ROLE_NAME" \
            --query 'Role.{Name:RoleName,Arn:Arn}' \
            --output table

          aws iam get-instance-profile \
            --instance-profile-name "$PROFILE_NAME" \
            --query 'InstanceProfile.Roles[].RoleName' \
            --output text

      # User data may take a few minutes to install nginx and upload to S3.
      - name: Verify the web server responds
        run: |
          echo "Polling $APP_URL"

          for attempt in $(seq 1 40); do

            if curl -fsS --max-time 5 "$APP_URL" -o /tmp/landing.html; then

              echo "Web server answered on attempt $attempt"

              grep -o '<title>[^<]*</title>' /tmp/landing.html || true

              {
                echo "## Validation Passed"
                echo ""
                echo "The landing page is live at $APP_URL"
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi

            echo "Attempt $attempt: not ready yet, waiting 15 seconds"

            sleep 15
          done

          echo "Web server did not respond within 10 minutes"

          exit 1